services:
  - type: web
    name: how-to-demo-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_PROVIDER
        value: openrouter
      - key: MODEL_NAME
        value: openrouter/free
